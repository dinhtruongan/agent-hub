[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthub"
version = "0.1.0"
description = "Multi-user, multi-agent collaboration platform with Discord as the human interface."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "cryptography>=43",
  "discord.py>=2.4",
  "mcp>=1.10,<2",
]

[project.scripts]
agenthub-local = "agenthub_local.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.6"]
router = ["google-genai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agenthub", "src/agenthub_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI Depends() in defaults is the intended pattern
